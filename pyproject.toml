[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "smolvla-hidden-state-analysis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "zarr<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
