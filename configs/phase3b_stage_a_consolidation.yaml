schema_version: 1
consolidation_revision: phase3b-stage-a-consolidated-v2

scientific_boundary:
  physical_state_lattice_may_span_oracle_contracts: true
  require_identical_shared_root_context_payload: true
  historical_construction_parameters_cryptographically_bound: false
  require_support_pair_within_one_source: false
  require_all_physical_pair_geometry_gates: true
  require_goal_specific_oracle_comparability_labels: true
  cross_execution_mode_factor_effects_estimable: false
  cross_source_generation_revision_effects_estimable: false
  drawer_aperture_source_revision_alias: true
  rationale: >-
    Previously completed candidates are immutable and must not be rerun. Candidate
    IDs, demonstrations, environment context apart from horizon, support,
    certificate, goal, and validation payloads are identical across the selected
    runs. Historical contracts omitted the construction-parameter YAML block, while
    config hashes, revision labels, source-file hashes, the later oracle horizon, and
    the proposal adapter differ. Exact observed states and physical support-pair
    geometry may be consolidated. One pair crosses source contracts and one pair
    contains a reused legacy drawer ledger, so oracle balance is reported per goal
    only where proposal and execution contracts match. Proposal coverage remains
    stratified by execution mode, and cross-aperture effects cannot be separated
    from source revision.

