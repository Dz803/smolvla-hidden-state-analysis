schema_version: 1
consolidation_revision: phase3b-stage-a-consolidated-v4

scientific_boundary:
  physical_state_lattice_may_span_oracle_contracts: true
  require_identical_shared_root_context_payload: true
  historical_construction_parameters_cryptographically_bound: false
  require_support_pair_within_one_source: false
  require_all_physical_pair_geometry_gates: true
  require_goal_specific_oracle_comparability_labels: true
  cross_execution_mode_factor_effects_estimable: false
  cross_source_generation_revision_effects_estimable: false
  drawer_aperture_source_revision_alias: true
  root_timestep_generation_batch_alias: true
  proposal_compatibility_is_not_physical_feasibility: true
  adaptive_factorized_certificate_precludes_population_inference: true
  factorized_controller_certificate_count: 1
  rationale: >-
    Previously completed candidates are immutable and must not be rerun. Candidate
    IDs, demonstrations, environment context apart from horizon, support,
    certificate, goal, and validation payloads are identical across the selected
    runs. Historical contracts omitted the construction-parameter YAML block, while
    config hashes, revision labels, source-file hashes, the later oracle horizon, and
    the proposal adapter and root timestep differ. Exact observed states and physical
    support-pair
    geometry may be consolidated. Two pairs cross source-run boundaries. The final
    root preserves an exhaustive registered cabinet bank at 0/46 while a separate
    factorized controller certificate establishes physical feasibility; proposal
    outcomes and physical feasibility are therefore reported as different evidence
    classes. Oracle cost balance is reported per goal only when both sides have a
    selected successful proposal. Proposal coverage remains stratified by execution
    mode, and cross-aperture effects cannot be separated from source revision.

